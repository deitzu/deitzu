name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SVG stats
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          user_json="$(gh api users/deitzu)"
          repos="$(jq -r '.public_repos' <<< "$user_json")"
          followers="$(jq -r '.followers' <<< "$user_json")"

          stars="$(
            gh api --paginate 'users/deitzu/repos?per_page=100&type=owner&sort=updated' --jq '.[].stargazers_count' |
              awk '{sum += $1} END {print sum + 0}'
          )"

          forks="$(
            gh api --paginate 'users/deitzu/repos?per_page=100&type=owner&sort=updated' --jq '.[].forks_count' |
              awk '{sum += $1} END {print sum + 0}'
          )"

          commits="$(
            gh api 'search/commits?q=author%3Adeitzu&per_page=1' --jq '.total_count'
          )"

          prs="$(
            gh api 'search/issues?q=author%3Adeitzu+type%3Apr&per_page=1' --jq '.total_count'
          )"

          updated="$(date -u '+%Y-%m-%d %H:%M UTC')"

          export STARS COMMITS REPOS FOLLOWERS FORKS PRS UPDATED
          STARS="$stars"
          COMMITS="$commits"
          REPOS="$repos"
          FOLLOWERS="$followers"
          FORKS="$forks"
          PRS="$prs"
          UPDATED="$updated"

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("profile.svg")
          text = path.read_text(encoding="utf-8")

          replacements = {
              r'(<text x="875" y="197"[^>]*>)[^<]*(</text>)': os.environ["STARS"],
              r'(<text x="992" y="197"[^>]*>)[^<]*(</text>)': os.environ["COMMITS"],
              r'(<text x="875" y="260"[^>]*>)[^<]*(</text>)': os.environ["REPOS"],
              r'(<text x="992" y="260"[^>]*>)[^<]*(</text>)': os.environ["FOLLOWERS"],
              r'(<text x="889" y="292"[^>]*>FORKS <tspan[^>]*>)[^<]*(</tspan></text>)': os.environ["FORKS"],
              r'(<text x="1006" y="292"[^>]*>PRs <tspan[^>]*>)[^<]*(</tspan></text>)': os.environ["PRS"],
              r'(<text x="885" y="340"[^>]*>)[^<]*(</text>)': os.environ["UPDATED"],
          }

          for pattern, value in replacements.items():
              text, count = re.subn(pattern, lambda m: m.group(1) + value + m.group(2), text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected exactly one SVG stat target, got {count}: {pattern}")

          path.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet -- profile.svg; then
            echo "No stat changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git commit -m "chore: update profile stats"
          git push
