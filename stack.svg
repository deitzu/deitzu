<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-label="Deitzu technology stack and why">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="350" fill="#1a1b26"/>
  <rect width="5" height="350" fill="url(#edge)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <text x="34" y="36" fill="#bb9af7" font-size="16" font-weight="800" letter-spacing="1">why these keep showing up in my projects</text>
    <text x="34" y="59" fill="#565f89" font-size="11">not a resume. just the stuff i keep running into.</text>

    <text x="34" y="96" fill="#7aa2f7" font-size="19" font-weight="800">C#</text>
    <text x="92" y="96" fill="#c0caf5" font-size="15">mostly because TShock and ServerCore dragged me into .NET.</text>

    <text x="34" y="139" fill="#bb9af7" font-size="19" font-weight="800">Java</text>
    <text x="92" y="139" fill="#c0caf5" font-size="15">JVM stuff, Android experiments, and trying to run Java things in odd places.</text>

    <text x="34" y="182" fill="#e0af68" font-size="19" font-weight="800">JavaScript</text>
    <text x="152" y="182" fill="#c0caf5" font-size="15">browser userscripts, PonyTown tools, Discord bots, random web stuff.</text>

    <text x="34" y="225" fill="#7dcfff" font-size="19" font-weight="800">Bash</text>
    <text x="112" y="225" fill="#c0caf5" font-size="15">mostly Termux, automation, and turning repetitive commands into one command.</text>

    <text x="34" y="268" fill="#7aa2f7" font-size="19" font-weight="800">Git</text>
    <text x="92" y="268" fill="#c0caf5" font-size="15">useful for keeping my projects from turning into a pile of random versions.</text>

    <text x="34" y="311" fill="#7dcfff" font-size="19" font-weight="800">Linux</text>
    <text x="112" y="311" fill="#c0caf5" font-size="15">mostly where i mess around with servers, Termux, and random system stuff.</text>
  </g>
</svg>