<!-- Interest: network security -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="120" viewBox="0 0 1100 120" role="img" aria-label="Network security">
  <rect width="1100" height="120" rx="14" fill="#1a1b26"/>
  <rect x="0" y="10" width="4" height="100" rx="2" fill="#bb9af7"/>
  <image href="./assets/shield.svg" x="34" y="30" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="98" y="44" fill="#c0caf5" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">NETWORK SECURITY</text>
  <text x="98" y="68" fill="#bb9af7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">network-focused / still exploring</text>
  <text x="98" y="91" fill="#565f89" font-size="11">ports, firewalls, services, traffic, the usual rabbit holes</text>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <image href="./assets/firewall.svg" x="720" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="754" y="47" fill="#c0caf5" font-size="12" font-weight="700">Firewall</text>

    <image href="./assets/port.svg" x="825" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="859" y="47" fill="#c0caf5" font-size="12" font-weight="700">Ports</text>

    <image href="./assets/tcp.svg" x="915" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="949" y="47" fill="#c0caf5" font-size="12" font-weight="700">TCP / UDP</text>

    <image href="./assets/dns.svg" x="1015" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1049" y="47" fill="#c0caf5" font-size="12" font-weight="700">DNS</text>
  </g>
</svg>