<!-- Interest: Linux / Termux -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="120" viewBox="0 0 1100 120" role="img" aria-label="Linux and Termux">
  <rect width="1100" height="120" rx="14" fill="#1a1b26"/>
  <rect x="0" y="10" width="4" height="100" rx="2" fill="#7dcfff"/>
  <image href="./assets/linux.svg" x="34" y="30" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="98" y="44" fill="#c0caf5" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">LINUX / TERMUX</text>
  <text x="98" y="68" fill="#7dcfff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">self-taught / ~2–3 years / most familiar</text>
  <text x="98" y="91" fill="#565f89" font-size="11">servers, CLI stuff, scripting, random system experiments</text>

  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <image href="./assets/debian.svg" x="715" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="750" y="47" fill="#c0caf5" font-size="12" font-weight="700">Debian</text>

    <image href="./assets/archlinux.svg" x="805" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="840" y="47" fill="#c0caf5" font-size="12" font-weight="700">Arch</text>

    <image href="./assets/ubuntu.svg" x="890" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="925" y="47" fill="#c0caf5" font-size="12" font-weight="700">Ubuntu</text>

    <image href="./assets/termux.svg" x="997" y="28" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1032" y="47" fill="#c0caf5" font-size="12" font-weight="700">Termux</text>
  </g>
</svg>